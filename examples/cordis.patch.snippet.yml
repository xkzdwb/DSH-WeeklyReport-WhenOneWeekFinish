# 把这段追加到 ~/.dsh/profiles/<profile>/cordis.patch.yml 的 insert 列表里。
#
# 说明：
# - name 指向本仓库里的插件文件，必须是机器上的绝对路径（Windows 用正斜杠更稳）。
# - to 是收件人，address 是发信账号；两者都换成你自己的邮箱。
# - 授权码不要写在这里，放 secrets.json（见 .gitignore 与 secrets.example.json）。
# - weekday：0=周日 … 6=周六；「周六夜里零点」= 周日 00:00 → weekday: 0，
#   想要周六 00:00 就写 6。
# - time 必须带引号，否则 YAML 会把它当成 60 进制整数。
# - 改完需要重启 DSH 才会装载（插件在 HOST 启动时读取源码）。
- insert:
    - id: weekly-report
      name: "/absolute/path/to/DSH-WeeklyReport-WhenOneWeekFinish/src/plugin.js"
      config:
        to: you@example.com
        address: sender@example.com
        displayName: DSH 周报
        secretsFile: "/absolute/path/to/DSH-WeeklyReport-WhenOneWeekFinish/secrets.json"
        weekday: 0
        time: "00:00"
        timeZone: Asia/Shanghai
        # 到点时 DSH 没开：下次启动补发一次（主题带「补发」）
        catchUp: true
        windowDays: 7
        # 与用量面板同一套占位价，单位是「每 100 万 token」；换模型时改这里
        pricing:
          default:
            input: 2
            output: 8
            cacheRead: 0.5
            cacheWrite: 2
